      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow-hardcase-magsafe" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg-hardcase-magsafe)"/>
  <rect x="30" y="20" width="340" height="260" rx="16" fill="#ffffff" filter="url(#shadow-hardcase-magsafe)"/>
  
  <g transform="translate(0, -10)">
    
            <rect x="145" y="65" width="110" height="175" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>
            <circle cx="200" cy="150" r="32" fill="none" stroke="#60a5fa" stroke-width="5" stroke-dasharray="10 5"/>
            <rect x="198" y="185" width="4" height="18" rx="2" fill="#60a5fa"/>
            <rect x="155" y="75" width="36" height="40" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
        
  </g>
  
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Hardcase MagSafe</text>
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Magnetic Armor Protection</text>
