<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Phone Grip PopSocket">
  <defs>
    <linearGradient id="bg-grip-popsocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow-grip-popsocket" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg-grip-popsocket)"/>
  <rect x="30" y="20" width="340" height="260" rx="16" fill="#ffffff" filter="url(#shadow-grip-popsocket)"/>
  
  <g transform="translate(0, -10)">
    
            <circle cx="200" cy="150" r="55" fill="#c2410c" stroke="#ea580c" stroke-width="4"/>
            <circle cx="200" cy="150" r="42" fill="#f97316"/>
            <circle cx="200" cy="150" r="28" fill="#ffedd5"/>
            <circle cx="200" cy="150" r="14" fill="#ea580c"/>
        
  </g>
  
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Phone Grip PopSocket</text>
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Universal Collapsible Socket</text>
</svg>