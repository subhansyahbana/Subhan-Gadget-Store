      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow-screen-tg-privacy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.12" flood-color="#0f172a"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg-screen-tg-privacy)"/>
  <rect x="30" y="20" width="340" height="260" rx="16" fill="#ffffff" filter="url(#shadow-screen-tg-privacy)"/>
  
  <g transform="translate(0, -10)">
    
            <rect x="145" y="65" width="110" height="175" rx="16" fill="#18181b" stroke="#4f46e5" stroke-width="4"/>
            <line x1="155" y1="75" x2="155" y2="230" stroke="#3f3f46" stroke-width="2"/>
            <line x1="170" y1="75" x2="170" y2="230" stroke="#3f3f46" stroke-width="2"/>
