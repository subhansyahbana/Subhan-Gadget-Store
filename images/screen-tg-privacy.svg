            <line x1="215" y1="75" x2="215" y2="230" stroke="#3f3f46" stroke-width="2"/>
            <line x1="230" y1="75" x2="230" y2="230" stroke="#3f3f46" stroke-width="2"/>
            <circle cx="200" cy="150" r="14" fill="#4f46e5"/>
